name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The kit is a Qt Quick module (Sol.Design); the build compiles its QML
      # and the gallery's, so a mistake in a .qml file fails here.
      - uses: jurplel/install-qt-action@v5
        with:
          version: "6.12.*"
          modules: qtmultimedia qtshadertools
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
