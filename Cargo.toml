[package]
name = "sol-quick"
description = "The Sol design language as a Qt Quick module, and the Rust side every world app shares"
version.workspace = true
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Draysh/sol-quick"
publish = false
# cxx-qt exports this crate's C++ build (the QML module) to the app that links it.
links = "sol_quick"

# Its own workspace, so it builds the same inside or outside a checkout of
# Sol: this crate (the QML module, the window) and `core/` (sol-quick-core,
# everything that needs no Qt), released together under one tag.
[workspace]
members = [".", "core"]
default-members = [".", "core"]

# The one version of both crates, and the release tag (v<version>).
[workspace.package]
version = "1.1.0"

[dependencies]
sol-quick-core = { path = "core" }
orbit = { git = "https://github.com/Draysh/sol-orbit", tag = "v1.1.0", features = ["app"] }
anyhow = "1"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
dirs = "6"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "signal", "macros"] }
tracing = "0.1.44"

[features]
# A stand-in Navidrome for the music worlds' previews and tests (`navidrome`).
fake-navidrome = ["sol-quick-core/fake-navidrome"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
